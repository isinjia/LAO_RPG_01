<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>오르카 전기</title>
<script>
// 세로로 든 휴대폰도 가로 크기의 독립 화면에서 실행하여 배치와 터치 좌표를 함께 회전한다.
if (window === window.top) {
  location.replace('landscape.html' + location.search + location.hash);
}
</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/lo.css">
<link rel="stylesheet" href="css/battle_lo.css">
</head>
<body>
<div id="stage"></div>
<div id="pops"></div>

<!-- 지도 전투 화면 -->
<div id="hud" class="hidden">
  <div id="top">
    <div id="turnBox"><span id="turnNo">1</span><small>턴</small><span id="phase" class="p">아군 차례</span></div>
    <button id="goalBox" class="ghost"></button>
    <div class="tbtns">
      <button id="btnDanger" data-key="R" class="ghost" title="적의 공격 범위 (R)">위험</button>
      <button id="btnSpd" data-key="V" class="ghost" title="배속 (V)">×1</button>
      <button id="btnFight" data-key="F" class="ghost" title="전투 장면 켜기·끄기 (F)">연출</button>
      <button id="btnAuto" data-key="Q" class="ghost" title="자동 전투 (Q)">자동</button>
      <button id="btnMenu" data-key="Esc" class="ghost" title="메뉴 (Esc)">메뉴</button>
      <button id="btnEnd" data-key="E" class="gold" title="턴 종료 (E)">턴 종료</button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="roster"></div>
  <div id="info" class="hidden"></div>
  <div id="acts" class="hidden"></div>
  <div id="forecast" class="hidden"></div>
</div>

<!-- 전투 연출 화면 -->
<div id="fight" class="hidden">
  <div class="fsplit"></div>
  <div class="fvs"><small></small></div>
  <div class="fband"></div>
  <div class="fcorner L"><div class="fbust"><img class="fimg" alt=""></div><div class="fname L"></div></div>
  <div class="fcorner R"><div class="fbust"><img class="fimg" alt=""></div><div class="fname R"></div></div>
  <div class="fpanel">
    <div class="frow h"><div class="fbar L"><i class="lag"></i><i class="fill"></i><b></b></div><em class="fval L"></em><span>영웅<small>HERO</small></span><em class="fval R"></em><div class="fbar R"><i class="lag"></i><i class="fill"></i><b></b></div></div>
    <div class="frow t"><div class="fbar L"><i class="lag"></i><i class="fill"></i><b></b></div><em class="fval L"></em><span>병사<small>TROOPS</small></span><em class="fval R"></em><div class="fbar R"><i class="lag"></i><i class="fill"></i><b></b></div></div>
  </div>
  <div class="fnums"></div>
  <div class="fskip">화면을 누르면 건너뜁니다</div>
</div>

<div id="banner" class="hidden"></div>
<div id="lofx"></div>

<!-- 대화 -->
<div id="talkBg" class="hidden"><div class="tbg"></div><div class="tbg"></div><div class="tstage"></div><img class="tcg" alt=""><div class="tshade"></div><div class="tfx"></div></div>
<div id="talk" class="hidden">
  <div class="tplace"><div class="pd"></div><div class="pn"></div></div>
  <div class="tchoices"></div>
  <div class="tbox" data-p="C">
    <div class="tname"></div>
    <div class="ttext"></div>
    <div class="ttouch"><i></i></div>
    <div class="tbar"><button data-k="log" class="hist">HISTORY</button><button data-k="auto">AUTO</button><button data-k="fast">FAST &gt;&gt;</button></div>
    <button data-k="skip" class="tskip">SKIP ▶</button>
  </div>
  <div class="tlog"><div class="tloghead">HISTORY</div><div class="tloglist"></div><div class="tlogfoot">화면을 누르면 닫힙니다</div></div>
  <div class="task"><div class="taskbox"><p>대화를 건너뛸까요?</p><div><button data-k="skipY" class="y">건너뛰기</button><button data-k="skipN">계속 보기</button></div></div></div>
</div>

<!-- 타이틀·스테이지 선택·출격 준비·결과 -->
<div id="screen"></div>
<div id="modal" class="hidden"></div>

<div id="boot">
  <img class="logo" src="assets/title/logo.webp" alt="LAST ORIGIN">
  <div class="bstage"></div>
  <div class="bload"><i></i><span id="loadMsg">불러오는 중…</span></div>
</div>
<div id="wipe"><i></i></div>
<div id="wipeOld"></div>

<script src="js/vendor/three.min.js"></script>
<script src="js/worldmap3d.js"></script>
<script src="js/fx_data.js"></script>
<script src="js/fx.js"></script>
<script src="js/sd.js"></script>
<script src="js/assets.js"></script>
<script src="js/anim_events.js"></script>
<script src="js/story.js"></script>
<script src="js/story_ch02.js"></script>
<script src="js/story_ch03.js"></script>
<script src="js/story_ch04.js"></script>
<script src="js/story_ch05.js"></script>
<script src="js/story_ch06.js"></script>
<script src="js/story_ch07.js"></script>
<script src="js/side.js"></script>
<script src="js/lobby.js"></script>
<script src="js/data.js"></script>
<script src="js/stagemaps.js"></script>
<script src="js/battle_events.js"></script>
<script src="js/classes.js"></script>
<script src="js/ifstory.js"></script>
<script src="js/rules.js"></script>
<script src="js/audio.js"></script>
<script src="js/dmgfont.js"></script>
<script src="js/lohud.js"></script>
<script src="js/battle.js"></script>
<script src="js/portrait.js"></script>
<script src="js/talk.js"></script>
<script src="js/commander.js"></script>
<script src="js/town.js"></script>
<script src="js/game.js"></script>
</body>
</html>
