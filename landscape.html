<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>오르카 전기</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
iframe{position:absolute;border:0;display:block;left:50%;top:50%;background:#000;transform-origin:50% 50%}
</style>
</head>
<body>
<iframe id="game" title="오르카 전기" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
const game = document.getElementById('game');
// 낮은 해상도에서도 배치 영역을 확보하고 화면 전체를 같은 비율로 줄인다.
function fitGame() {
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
  const rotated = h > w;
  const availableW = rotated ? h : w, availableH = rotated ? w : h;
  const scale = Math.min(1, availableW / 1280, availableH / 720);
  game.style.width = (availableW / scale) + 'px';
  game.style.height = (availableH / scale) + 'px';
  game.style.transform = 'translate(-50%, -50%) rotate(' + (rotated ? 90 : 0) + 'deg) scale(' + scale + ')';
}
fitGame();
addEventListener('resize', fitGame);
if (window.visualViewport) visualViewport.addEventListener('resize', fitGame);
game.src = 'index.html' + location.search + location.hash;
</script>
</body>
</html>
